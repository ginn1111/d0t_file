print_info() {
  prin "$(color 10)╭──────────────────────────────────────╮"
  info "  $(color 14)  " title
  prin "$(color 10)├──────────────────────────────────────┤"

  prin "$(color 11)  SYSTEM"
  info "  $(color 14)  " cpu
  info "  $(color 10)󰍛  " gpu
  info "  $(color 12)  " memory
  info "  $(color 14)󰩶  " resolution

  prin "$(color 10)├──────────────────────────────────────┤"
  prin "$(color 11)  SESSION"
  info "  $(color 14)  " distro
  info "  $(color 10)  " wm
  info "  $(color 12)  " shell
  info "  $(color 11)  " term
  info "  $(color 14)󰔟  " theme
  info "  $(color 10)󰏘  " icons
  info "  $(color 12)󰏖  " packages
  info "  $(color 11)󰅐  " uptime

  prin "$(color 10)╰──────────────────────────────────────╯"
  prin "$(color 14)  ◈  $(color 10)signal online  $(color 8)•  $(color 11)$(date +%H:%M)"
  prin " "
}

kernel_shorthand="on"
distro_shorthand="on"
os_arch="off"
uptime_shorthand="on"
memory_percent="on"
memory_unit="gib"
package_managers="on"
shell_path="off"
shell_version="off"
cpu_brand="on"
cpu_speed="off"
cpu_cores="off"
cpu_temp="off"
gpu_brand="on"
gpu_type="all"
refresh_rate="off"
gtk_shorthand="on"
bold="on"
separator="  "
image_source="auto"
gap=2
stdout="off"
ascii_colors=(10 14 12 11 10 14 12)
image_backend="ascii"
