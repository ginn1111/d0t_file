# Neofetch — Cindy Warm Dusk
# Palette: ~/tools/agent-d0tfile/themes/cindy/warm-dusk.palette
# Rule:    honey = focus/accent only (title, section heads, logo); frame stays dim.

# Truecolor support: color "#rrggbb" -> 24-bit escape; numbers keep stock behaviour.
color() {
    case $1 in
        \#??????)
            local h=${1#\#}
            printf '\e[38;2;%d;%d;%dm' "0x${h:0:2}" "0x${h:2:2}" "0x${h:4:2}" ;;
        [0-6])    printf '%b\e[3%sm'   "$reset" "$1" ;;
        7 | "fg") printf '\e[37m%b'    "$reset" ;;
        *)        printf '\e[38;5;%bm' "$1" ;;
    esac
}

# Palette
ruby="#d9a05b"   # accent
fg="#d6cbb8"
sub="#b3a894"
dim="#807663"
ghost="#5c5447"
rule="#3b332a"
info_c="#8fb3b0"
turq="#86b8a0"
purple="#b896b8"
pink="#d39aa6"
yellow="#d8c37a"
ok="#a3b371"

print_info() {
  prin "$(color $rule)╭──────────────────────────────────────╮"
  info "  $(color $ruby)  " title
  prin "$(color $rule)├──────────────────────────────────────┤"

  prin "$(color $ruby)  SYSTEM"
  info "  $(color $info_c)  " cpu
  info "  $(color $purple)󰍛  " gpu
  info "  $(color $turq)  " memory
  info "  $(color $pink)󰩶  " resolution

  prin "$(color $rule)├──────────────────────────────────────┤"
  prin "$(color $ruby)  SESSION"
  info "  $(color $info_c)  " distro
  info "  $(color $purple)  " wm
  info "  $(color $turq)  " shell
  info "  $(color $pink)  " term
  info "  $(color $yellow)󰔟  " theme
  info "  $(color $info_c)󰏘  " icons
  info "  $(color $purple)󰏖  " packages
  info "  $(color $turq)󰅐  " uptime

  prin "$(color $rule)╰──────────────────────────────────────╯"
  prin "$(color $ruby)  ◈  $(color $ok)signal online  $(color $ghost)•  $(color $sub)$(date +%H∶%M)"  # U+2236: neofetch eats the first ASCII ':'
  prin " "
}

# Text colors: title, @, underline, subtitle, colon, info
colors=("$ruby" "$dim" "$rule" "$sub" "$ghost" "$fg")

kernel_shorthand="on"
distro_shorthand="on"
os_arch="off"
uptime_shorthand="on"
memory_percent="on"
memory_unit="gib"
package_managers="on"
shell_path="off"
shell_version="off"
cpu_brand="on"
cpu_speed="off"
cpu_cores="off"
cpu_temp="off"
gpu_brand="on"
gpu_type="all"
refresh_rate="off"
gtk_shorthand="on"
bold="on"
separator="  "
gap=2
stdout="off"
# Logo: GIN in the Ubuntu-disc style (gin.txt). c1 = honey disc, c2 = fg letters.
image_source="${XDG_CONFIG_HOME:-$HOME/.config}/neofetch/gin.txt"
ascii_colors=("$ruby" "$fg" "$ghost" "$ruby" "$sub" "$ghost")
image_backend="ascii"
