#################################################################
#  picom.conf — picom v12 (i3 + polybar + rofi)
#  Location : ~/tools/d0t_file/picom/picom.conf
#  Linked to: ~/.config/picom/picom.conf
#  Docs     : man picom   |   https://picom.app
#################################################################


#################################
#           Backend             #
#################################
# AMD radeonsi, hardware accelerated -> glx is the stable choice.
backend = "glx";
vsync = true;                  # no tearing on the 100 Hz monitors
use-damage = true;             # repaint only changed areas
dithered-present = false;
glx-no-stencil = true;
xrender-sync-fence = true;

# Unredirect fullscreen windows (games/video) for lower latency.
unredir-if-possible = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

log-level = "warn";


#################################
#           Shadows             #
#################################
shadow = true;
shadow-radius = 14;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.5;
shadow-color = "#000000";


#################################
#           Fading              #
#################################
# Used for opacity changes. Open/close are handled by `animations`
# when they are defined (animations take over from fading).
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;


#################################
#     Opacity / Corners         #
#################################
frame-opacity = 0.9;
corner-radius = 0;             # square corners, matches xborders --border-radius 0


#################################
#             Blur              #
#################################
# Off by default (cheap). Enable per-window in `rules` with
# `blur-background = true;` e.g. for a translucent terminal.
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = false;


#################################
#          Animations           #
#################################
# picom v12 animation scripts. Presets: appear/disappear,
# slide-in/slide-out, fly-in/fly-out, geometry-change.
# In i3, switching workspaces maps/unmaps windows, so open/close
# also animate workspace switches.
# Per-window overrides live in `rules` below (last match wins).
animations = (
  # Window opens / workspace shows it: scale up + fade in
  { triggers = [ "open", "show" ];
    preset   = "appear";
    duration = 0.18;
    scale    = 0.92; },

  # Window closes / workspace hides it: scale down + fade out
  { triggers = [ "close", "hide" ];
    preset   = "disappear";
    duration = 0.14;
    scale    = 0.92; },

  # Opacity changes (picom-trans, opacity rules): smooth fade
  { triggers = [ "increase-opacity", "decrease-opacity" ];
    opacity = { duration = 0.15; curve = "cubic-bezier(0.25, 0.1, 0.25, 1)";
                start = "window-raw-opacity-before"; end = "window-raw-opacity"; };
    shadow-opacity = "opacity"; },
);


#################################
#        Window rules           #
#################################
# Matched top to bottom; later matches override earlier ones.
rules = (
  # --- Bars, desktop, i3 frames: flat, no effects -------------
  { match = "window_type = 'dock' || window_type = 'desktop'";
    shadow = false; blur-background = false; corner-radius = 0; },
  { match = "class_g = 'Polybar' || class_g = 'i3bar'";
    shadow = false; },
  { match = "class_g = 'i3-frame'"; shadow = false; },

  # --- Overlays: xborders, unnamed helper windows --------------
  { match = "name *?= 'xborders' || class_g *?= 'xborders'";
    shadow = false; blur-background = false; corner-radius = 0; },
  { match = "! name ~= ''"; shadow = false; },

  # --- Rofi: themes draw their own look ------------------------
  { match = "class_g = 'Rofi'"; shadow = false; corner-radius = 0; },

  # --- Notifications / tooltips / menus ------------------------
  # dunst variant 002 "accent rail": borderless cards lifted by a soft shadow;
  # dunst-rail.glsl paints the 4px left rail keyed on card bg colour.
  { match = "window_type = 'notification' || class_g = 'Dunst'";
    shadow = true; full-shadow = true; shader = "dunst-rail.glsl"; },
  { match = "window_type = 'tooltip'";
    shadow = false; opacity = 0.9; full-shadow = false; },
  { match = "window_type = 'dropdown_menu' || window_type = 'popup_menu' || "
            "window_type = 'menu'";
    shadow = false; },

  # --- Browsers: GTK/CSD draw their own shadow ------------------
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; blur-background = false; },
  { match = "class_g ?= 'Brave-browser' || class_g ?= 'Google-chrome' || "
            "class_g ?= 'firefox'";
    shadow = false; },

  # --- Video / fullscreen ---------------------------------------
  { match = "fullscreen"; corner-radius = 0; shadow = false; },
  { match = "class_g ?= 'vlc' || class_g ?= 'mpv'"; shadow = false; },

  # --- Misc ----------------------------------------------------
  { match = "class_g = 'copyq'"; opacity = 0.85; },
  { match = "class_g = 'flameshot'"; shadow = false; },

  ##############################################################
  #  Animation overrides
  ##############################################################
  # Tiled windows: animate size/position changes (split, resize,
  # move). EXPERIMENTAL in picom — remove this block if you see
  # flicker or stretched content when resizing.
  { match = "window_type = 'normal' && ! fullscreen";
    animations = (
      { triggers = [ "geometry" ];
        preset   = "geometry-change";
        duration = 0.15; },
    ); },

  # Rofi: quick drop-in from above
  { match = "class_g = 'Rofi'";
    animations = (
      { triggers = [ "open", "show" ];  preset = "slide-in";
        direction = "down"; duration = 0.15; },
      { triggers = [ "close", "hide" ]; preset = "disappear";
        scale = 1.0; duration = 0.10; },
    ); },

  # Notifications: fly in from the right edge
  { match = "window_type = 'notification' || class_g = 'Dunst'";
    animations = (
      { triggers = [ "open", "show" ];  preset = "fly-in";
        direction = "left"; duration = 0.2; },
      { triggers = [ "close", "hide" ]; preset = "fly-out";
        direction = "right"; duration = 0.2; },
    ); },

  # Menus / tooltips: fast, subtle
  { match = "window_type = 'dropdown_menu' || window_type = 'popup_menu' || "
            "window_type = 'menu' || window_type = 'tooltip'";
    animations = (
      { triggers = [ "open", "show" ];  preset = "appear";
        scale = 0.98; duration = 0.08; },
      { triggers = [ "close", "hide" ]; preset = "disappear";
        scale = 0.98; duration = 0.06; },
    ); },

  # Bars / desktop / border overlays / fullscreen: no animation.
  # A script with no timing function ends instantly, which is
  # the documented way to disable animation for a trigger.
  # (Last match wins, so this must stay at the bottom.)
  { match = "window_type = 'dock' || window_type = 'desktop' || "
            "class_g = 'Polybar' || name *?= 'xborders' || "
            "class_g *?= 'xborders' || fullscreen";
    animations = (
      { triggers = [ "open", "show", "close", "hide", "geometry" ];
        var-none = 0; },
    ); },
);
