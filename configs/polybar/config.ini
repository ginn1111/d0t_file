;==========================================================
;  Polybar — Cindy Warm Dusk (compact)
;  Palette: ~/tools/agent-d0tfile/themes/cindy/warm-dusk.palette
;  Font:    EnvyCodeR Nerd Font
;  Rule:    honey = focus/accent only; errors use err (#cf6b6b)
;==========================================================

[colors]
background = #1d1a17
background-alt = #26211c
surface = #2a2520
rule = #3b332a
foreground = #d6cbb8
sub = #b3a894
dim = #807663
ghost = #5c5447
primary = #d9a05b
ok = #a3b371
warn = #e3876a
info = #8fb3b0
alert = #cf6b6b
disabled = #5c5447

[bar/base]
monitor = ${env:MONITOR:}
width = 100%
height = 22pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
; floating: transparent gap on all 4 sides
border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1
module-margin = 0

separator = "  "
separator-foreground = ${colors.rule}

font-0 = EnvyCodeR Nerd Font:size=11;3
font-1 = EnvyCodeR Nerd Font:style=Bold:size=11;3
; safety fallback for any glyph EnvyCodeR lacks
font-2 = IoskeleyMono Nerd Font Mono:size=11;3

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true


; Top: basics only — where am I, what's focused, volume/layout/time
[bar/top]
inherit = bar/base
bottom = false
modules-left = brand i3ws xwindow
modules-right = pulseaudio-control fcitx5 date

; Bottom: system info
[bar/bottom]
inherit = bar/base
bottom = true
modules-left = sysbrand cpu cputemp memory filesystem services
modules-right = eth wlan

; Single tray per session; add "systray" to a modules-* list to enable.
[module/systray]
type = internal/tray
format-margin = 4pt
tray-spacing = 8pt

[module/brand]
type = custom/text
format = "%{O6}◇%{O7}"
format-foreground = ${colors.primary}
format-font = 2
click-left = ~/.config/rofi/applets/bin/cindy.sh &

[module/sysbrand]
type = custom/text
format = "%{O10}󰍹%{O3}"
format-foreground = ${colors.primary}
format-font = 2

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.rule}
label-active-foreground = ${colors.foreground}
label-active-underline = ${colors.primary}
label-active-font = 2
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.sub}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.ghost}
label-empty-padding = 1

; i3 workspaces + app icons of the windows on each (replaces xworkspaces)
; icon map / colors: scripts/i3-workspaces.py
[module/i3ws]
type = custom/script
exec = ~/.config/polybar/scripts/i3-workspaces.py
tail = true
format-padding = 1
scroll-up = ~/.config/polybar/scripts/i3-workspaces.py cmd workspace prev_on_output
scroll-down = ~/.config/polybar/scripts/i3-workspaces.py cmd workspace next_on_output

[module/xwindow]
type = internal/xwindow
format-padding = 1
label = %title:0:60:…%
label-foreground = ${colors.sub}

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
format-mounted-padding = 1
label-mounted = %{F#d9a05b}󰋊%{F-} %percentage_used%%
label-unmounted = %mountpoint% n/a
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = 󰝟 muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
format-padding = 1
format-prefix = "󰌌 "
format-prefix-foreground = ${colors.primary}
label-layout = %layout%
label-layout-foreground = ${colors.sub}
label-indicator-padding = 1
label-indicator-margin = 0
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.warn}

; fcitx5 input method (EN/VI) — XKB stays "us" while unikey is active,
; so xkeyboard can't show it. Click toggles, right-click opens config.
[module/fcitx5]
type = custom/script
exec = ~/.config/polybar/scripts/fcitx5-im.sh
tail = true
format-padding = 1
format-prefix = "󰌌 "
format-prefix-foreground = ${colors.primary}
label = %output%
label-foreground = ${colors.sub}
click-left = ~/.local/bin/fcitx5-remote -t
click-right = ~/.local/bin/fcitx5-configtool &

[module/memory]
type = internal/memory
interval = 2
format-padding = 1
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-padding = 1
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
format-connected-padding = 1
format-disconnected-padding = 1
label-disconnected = %{F#5c5447}󰖪 %ifname%%{F-}

[module/wlan]
inherit = network-base
interface-type = wireless
; internal/network has no click-* keys -> wrap labels in action tags
label-connected = %{A1:~/.config/rofi/applets/bin/network.sh &:}%{F#d9a05b}󰖩%{F-} %essid% %{F#807663}%local_ip%%{F-}%{A}
label-disconnected = %{A1:~/.config/rofi/applets/bin/network.sh &:}%{F#5c5447}󰖪 %ifname%%{F-}%{A}

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#d9a05b}󰈀%{F-} %{F#b3a894}%local_ip%%{F-}

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %a %d %b %H:%M:%S
format-padding = 1
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.primary}
label = %date%
label-foreground = ${colors.foreground}
label-font = 2

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

; ---- Awesome-Polybar starter set ----
[module/pulseaudio-control]
type = custom/script
tail = true
format-padding = 1
exec = ~/.config/polybar/scripts/pulseaudio-control --icons-volume "%{F#d9a05b}󰕿%{F-},%{F#d9a05b}󰖀%{F-},%{F#d9a05b}󰕾%{F-}" --icon-muted "󰝟" --color-muted 475262 --format '$VOL_ICON $VOL_LEVEL%' --node-nicknames-from "device.description" listen
click-right = exec pavucontrol &
click-left = ~/.config/polybar/scripts/pulseaudio-control togmute
click-middle = ~/.config/polybar/scripts/pulseaudio-control next-node
scroll-up = ~/.config/polybar/scripts/pulseaudio-control --volume-max 130 up
scroll-down = ~/.config/polybar/scripts/pulseaudio-control --volume-max 130 down

[module/cputemp]
type = custom/script
exec = ~/.config/polybar/scripts/system-cpu-temppercore.sh
interval = 5
format-padding = 1
format-prefix = "󰔏 "
format-prefix-foreground = ${colors.primary}

[module/services]
type = custom/script
exec = systemctl --type=service --state=running list-units --no-pager --no-legend | wc -l
interval = 10
format-padding = 1
format-prefix = "󰒋 "
format-prefix-foreground = ${colors.primary}
click-left = ~/.config/polybar/scripts/services.sh &
