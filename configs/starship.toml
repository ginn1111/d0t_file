"$schema" = "https://starship.rs/config-schema.json"

# Compact prompt, rich dev context.
#   left : [user@host only on ssh/root] dir  branch@sha state status +/-  jobs ❯
#   right: exit-code  duration  runtimes  infra
format = """
$username$hostname$directory$git_branch$git_commit$git_state$git_status$git_metrics$jobs $character"""
right_format = """
$status$cmd_duration$python$nodejs$bun$deno$golang$rust$java$kotlin$ruby$php$dotnet$elixir$lua$swift$zig$c$docker_context$kubernetes$aws$gcloud$terraform$nix_shell$conda"""

add_newline = false
command_timeout = 800
palette = "cindy"

# Cindy Warm Dusk. Hex source: ~/tools/agent-d0tfile/themes/cindy/warm-dusk.palette
# Roles + mapping: ~/tools/agent-d0tfile/themes/cindy/REGISTRY.md (starship)
# Keys are Colour names; pick by Role. accent = focus only, err = errors only.
[palettes.cindy]
fg = "#d6cbb8"
sub = "#b3a894"
dim = "#807663"
ghost = "#5c5447"
accent = "#d9a05b"
err = "#cf6b6b"
warn = "#e3876a"
ok = "#a3b371"
info = "#8fb3b0"
purple = "#b896b8"
pink = "#d39aa6"
yellow = "#d8c37a"
turquoise = "#86b8a0"
green_alt = "#8aa6c1"

# ── Left ────────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold err)"
vimcmd_symbol = "[❮](bold accent)"

[username]
show_always = false            # only when root or over SSH
style_user = "sub"
style_root = "bold err"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "dim"
format = "[@$hostname]($style) "

[directory]
style = "info"
repo_root_style = "bold info"
format = "[$path]($style)[$read_only]($read_only_style)"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " "
read_only_style = "err"

[git_branch]
symbol = " "
style = "bold purple"
format = " [$symbol$branch(:$remote_branch)]($style)"
truncation_length = 24
truncation_symbol = "…"
only_attached = false

[git_commit]
style = "dim"
format = "[@$hash$tag]($style)"
commit_hash_length = 7
only_detached = true
tag_disabled = false
tag_symbol = " 🏷 "

[git_state]
style = "bold yellow"
format = " [$state( $progress_current/$progress_total)]($style)"

[git_status]
style = "warn"
format = "( [$conflicted$stashed$staged$modified$renamed$deleted$untracked$ahead_behind]($style))"
conflicted = "[=${count}](bold err)"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = "≡${count}"
modified = "!${count}"
staged = "[+${count}](ok)"
renamed = "»${count}"
deleted = "✘${count}"

[git_metrics]
disabled = false
added_style = "ok"
deleted_style = "err"
format = "( [+$added]($added_style))([-$deleted]($deleted_style))"

[jobs]
symbol = "✦"
style = "bold turquoise"
number_threshold = 1
format = " [$symbol$number]($style)"

# ── Right ───────────────────────────────────────────────────────────
[status]
disabled = false
symbol = "✘"
style = "bold err"
format = "[$symbol$status]($style) "
map_symbol = true
pipestatus = true
pipestatus_format = "[$pipestatus]($style) "

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[⏱ $duration]($style) "

# Runtimes: major.minor only; spare hues (accent/err reserved)
[python]
symbol = " "
style = "yellow"
version_format = "${major}.${minor}"
format = "[$symbol$version( \\($virtualenv\\))]($style) "

[nodejs]
symbol = " "
style = "ok"
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[bun]
symbol = " "
style = "sub"
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[deno]
symbol = " "
style = "sub"
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "turquoise"
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "warn"
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[java]
symbol = " "
style = "warn"
version_format = "${major}"
format = "[$symbol$version]($style) "

[kotlin]
symbol = " "
style = "purple"
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[ruby]
symbol = " "
style = "pink"
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[php]
symbol = " "
style = "purple"
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[dotnet]
symbol = " "
style = "purple"
version_format = "${major}.${minor}"
format = "[$symbol$version( $tfm)]($style) "

[elixir]
symbol = " "
style = "purple"
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[lua]
symbol = " "
style = "info"
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[swift]
symbol = " "
style = "warn"
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[zig]
symbol = " "
style = "yellow"
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[c]
symbol = " "
style = "green_alt"
version_format = "${major}"
format = "[$symbol$version]($style) "

# Infra / context
[docker_context]
symbol = " "
style = "info"
only_with_files = true
format = "[$symbol$context]($style) "

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "turquoise"
format = "[$symbol$context( \\($namespace\\))]($style) "
detect_files = ["k8s", "kustomization.yaml", "Chart.yaml", "skaffold.yaml"]

[aws]
symbol = " "
style = "warn"
format = "[$symbol$profile(\\($region\\))]($style) "

[gcloud]
symbol = " "
style = "info"
format = "[$symbol$project]($style) "

[terraform]
symbol = " "
style = "purple"
format = "[$symbol$workspace]($style) "

[nix_shell]
symbol = " "
style = "green_alt"
format = "[$symbol$state]($style) "

[conda]
symbol = " "
style = "ok"
ignore_base = true
format = "[$symbol$environment]($style) "
