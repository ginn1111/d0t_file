
format = "$username$hostname $directory$git_branch$git_status $character"
right_format = "$nodejs$golang$python$rust$java$ruby$php$dotnet$elixir$haskell$kotlin$lua$swift$zig$cmd_duration$time"
palette = "vscode"

[palettes.vscode]
vscode_muted = "#858585"
vscode_text = "#CCCCCC"
vscode_blue = "#569CD6"
vscode_cyan = "#4EC9B0"
vscode_green = "#23D18B"
vscode_yellow = "#DCDCAA"
vscode_orange = "#CE9178"
vscode_red = "#F14C4C"

[character]
success_symbol = "[◈](bold vscode_green)"
error_symbol = "[✗](bold vscode_red)"
vimcmd_symbol = "[◀](bold vscode_green)"

[hostname]
ssh_only = false
style = "vscode_cyan"
format = "[\\[@$hostname\\]]($style)"

[directory]
style = "bold vscode_blue"
format = "[\\[$path\\]]($style)$read_only"
truncation_length = 2
truncate_to_repo = false
read_only = " "
read_only_style = "vscode_red"

[aws]
format = '\[[$symbol($profile)(\($region\))(\[$duration\])]($style)\]'
symbol = " "

[bun]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[c]
format = '\[[$symbol($version(-$name))]($style)\]'
symbol = " "

[cmake]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[cmd_duration]
format = '\[[⏱ $duration]($style)\]'
style = "vscode_yellow"

[cobol]
format = '\[[$symbol($version)]($style)\]'

[conda]
format = '\[[$symbol$environment]($style)\]'

[crystal]
format = '\[[$symbol($version)]($style)\]'

[daml]
format = '\[[$symbol($version)]($style)\]'

[dart]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[deno]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[docker_context]
format = '\[[$symbol$context]($style)\]'
symbol = " "

[dotnet]
format = '\[[$symbol($version)(🎯 $tfm)]($style)\]'
symbol = " "

[elixir]
format = '\[[$symbol($version \(OTP $otp_version\))]($style)\]'
symbol = " "

[elm]
format = '\[[$symbol($version)]($style)\]'

[erlang]
format = '\[[$symbol($version)]($style)\]'

[fennel]
format = '\[[$symbol($version)]($style)\]'

[fossil_branch]
format = '\[[$symbol$branch]($style)\]'

[gcloud]
format = '\[[$symbol$account(@$domain)(\($region\))]($style)\]'
symbol = " "

[git_branch]
format = '\[[$symbol$branch]($style)\]'
symbol = " "
style = "bold vscode_yellow"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'
style = "bold vscode_orange"

[golang]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[gradle]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[guix_shell]
format = '\[[$symbol]($style)\]'

[haskell]
format = '\[[$symbol($version)]($style)\]'

[haxe]
format = '\[[$symbol($version)]($style)\]'

[helm]
format = '\[[$symbol($version)]($style)\]'

[hg_branch]
format = '\[[$symbol$branch]($style)\]'

[java]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[julia]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[kotlin]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[kubernetes]
format = '\[[$symbol$context( \($namespace\))]($style)\]'
symbol = "󱃾 "

[lua]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[memory_usage]
format = '\[$symbol[$ram( | $swap)]($style)\]'

[meson]
format = '\[[$symbol$project]($style)\]'

[nim]
format = '\[[$symbol($version)]($style)\]'

[nix_shell]
format = '\[[$symbol$state( \($name\))]($style)\]'

[nodejs]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[ocaml]
format = '\[[$symbol($version)(\($switch_indicator$switch_name\))]($style)\]'

[opa]
format = '\[[$symbol($version)]($style)\]'

[openstack]
format = '\[[$symbol$cloud(\($project\))]($style)\]'

[os]
format = '\[[$symbol]($style)\]'

[package]
format = '\[[$symbol$version]($style)\]'
symbol = "󰏗 "

[perl]
format = '\[[$symbol($version)]($style)\]'

[php]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[pijul_channel]
format = '\[[$symbol$channel]($style)\]'

[pulumi]
format = '\[[$symbol$stack]($style)\]'
symbol = " "

[purescript]
format = '\[[$symbol($version)]($style)\]'

[python]
format = '\[[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style)\]'
symbol = " "

[raku]
format = '\[[$symbol($version-$vm_version)]($style)\]'

[red]
format = '\[[$symbol($version)]($style)\]'

[ruby]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[rust]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[scala]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[spack]
format = '\[[$symbol$environment]($style)\]'

[sudo]
format = '\[[as $symbol]($style)\]'

[swift]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[terraform]
format = '\[[$symbol$workspace]($style)\]'
symbol = " "

[time]
disabled = false
time_format = "%H:%M"
style = "vscode_muted"
format = "[\\[$time ◇\\]]($style)"

[username]
style_user = "bold vscode_blue"
style_root = "bold vscode_red"
show_always = true
format = "[\\[$user\\]]($style)"

[vagrant]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[vlang]
format = '\[[$symbol($version)]($style)\]'

[zig]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[solidity]
format = '\[[$symbol($version)]($style)\]'
