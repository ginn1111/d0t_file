format = """
[╭─](bold bright-green)[◉](bold matrix_bright) $username$hostname $directory$git_branch$git_status
[╰─](bold bright-green)$character """
right_format = "$cmd_duration$time"
palette = "matrix"

[palettes.matrix]
matrix_dim = "#267d69"
matrix_green = "#18e000"
matrix_bright = "#83f5c8"
matrix_teal = "#1ad6b0"
matrix_lime = "#bde000"
matrix_amber = "#df8008"

[character]
success_symbol = "[➜](bold matrix_bright)"
error_symbol = "[✗](bold matrix_amber)"
vimcmd_symbol = "[◀](bold matrix_teal)"

[hostname]
ssh_only = false
style = "matrix_dim"
format = "[@$hostname]($style)"

[directory]
style = "bold matrix_teal"
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncate_to_repo = false
read_only = " "
read_only_style = "matrix_amber"

[aws]
format = '\[[$symbol($profile)(\($region\))(\[$duration\])]($style)\]'
symbol = " "

[bun]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[c]
format = '\[[$symbol($version(-$name))]($style)\]'
symbol = " "

[cmake]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[cmd_duration]
format = '\[[⏱ $duration]($style)\]'
style = "matrix_amber"

[cobol]
format = '\[[$symbol($version)]($style)\]'

[conda]
format = '\[[$symbol$environment]($style)\]'

[crystal]
format = '\[[$symbol($version)]($style)\]'

[daml]
format = '\[[$symbol($version)]($style)\]'

[dart]
